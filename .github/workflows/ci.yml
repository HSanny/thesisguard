name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: pytest backend/tests -q

  license-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application dependencies
        run: pip install -r backend/requirements.txt
      - name: Install license audit tooling
        run: pip install pip-licenses==5.5.5
      - name: Enforce dependency license policy
        run: python scripts/license_guard.py
      - name: Generate full dependency license report
        run: |
          mkdir -p build
          pip-licenses --format=json --with-urls --output-file=build/dependency-licenses.json
          pip-licenses --format=markdown --with-urls --output-file=build/dependency-licenses.md
      - name: Upload license audit report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-license-report
          path: |
            build/dependency-licenses.json
            build/dependency-licenses.md
