services:
  api:
    build: .
    command: sh -c 'uvicorn backend.app.main:app --host 0.0.0.0 --port 8000'
    ports: ["8000:8000"]
    env_file: .env
    volumes: ["./config:/app/config"]
  worker:
    build: .
    command: python -m backend.app.worker
    env_file: .env
    volumes: ["./config:/app/config"]
