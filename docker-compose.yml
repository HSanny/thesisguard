services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: thesisguard
      POSTGRES_PASSWORD: thesisguard
      POSTGRES_DB: thesisguard
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thesisguard"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://thesisguard:thesisguard@postgres:5432/thesisguard
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    build: .
    command: python -m backend.app.worker
    environment:
      DATABASE_URL: postgresql://thesisguard:thesisguard@postgres:5432/thesisguard
    depends_on:
      postgres:
        condition: service_healthy
